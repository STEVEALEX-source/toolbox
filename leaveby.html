  <header class="site-header">

    <nav class="main-nav">
      <a href="index.html#tools">Tools</a>

      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">Dark</button>
    </nav>

  <nav class="breadcrumbs" aria-label="Breadcrumb">

  <main class="tool-main">
    <div class="tool-page-head">
      <h1>Leave by</h1>
      <p class="tool-page-desc">You need to arrive at a time. This says when to walk out the door.</p>
    </div>
    <div class="tool-panel" id="toolRoot">
<p class="tool-hint">Enter when you must arrive and how long the trip takes.</p><label for="leaveArrive">Arrive by</label><input type="time" id="leaveArrive" value="09:00"><label for="leaveTravel">Travel time (minutes)</label><input type="number" id="leaveTravel" min="1" value="25"><label for="leaveBuffer">Buffer (minutes)</label><input type="number" id="leaveBuffer" min="0" value="10"><div class="btn-row"><button class="btn primary" type="button" id="leaveCalc">Calculate</button></div><div class="convert-result" id="leaveResult">Set a time and press calculate.</div>
    </div>
    <p class="tool-back"><a href="index.html#tools">All tools</a></p>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>

  <footer>
    <div class="footer-inner">
      <span>toolbox</span>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>Customs guess · Toolbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page" data-tool="customs">
  <header class="site-header">
    <a class="brand" href="index.html">toolbox</a>
    <nav class="main-nav">
      <a href="index.html#tools">Tools</a>
      <a href="index.html#about">About</a>
      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">Dark</button>
    </nav>
  </header>

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <a href="index.html#tools">Tools</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="current">Customs guess</span>
  </nav>

  <main class="tool-main">
    <div class="tool-page-head">
      <h1>Customs guess</h1>
      <p class="tool-page-desc">Rough idea of what a package might cost.</p>
    </div>
    <div class="tool-panel" id="toolRoot">
<label for="dutyValue">Item value (currency units)</label><input type="number" id="dutyValue" value="100" min="0" step="0.01"><label for="dutyRate">Duty rate (%)</label><input type="number" id="dutyRate" value="10" min="0" step="0.1"><label for="dutyShipping">Shipping</label><input type="number" id="dutyShipping" value="15" min="0" step="0.01"><label for="dutyTax">Tax / VAT (%)</label><input type="number" id="dutyTax" value="0" min="0" step="0.1"><div class="duty-result" id="dutyResult"></div><p style="margin:0;font-size:0.85rem;color:var(--muted)">Estimate only. Rules differ by country and item type.</p>
    </div>
    <p class="tool-back"><a href="index.html#tools">All tools</a></p>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>

  <footer>
    <div class="footer-inner">
      <span>toolbox</span>
      <span>runs in your browser</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

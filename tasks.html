<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>Tasks · Toolbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page" data-tool="tasks">
  <header class="site-header">
    <a class="brand" href="index.html">toolbox</a>
    <nav class="main-nav">
      <a href="index.html#tools">Tools</a>
      <a href="index.html#about">About</a>
      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">Dark</button>
    </nav>
  </header>

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <a href="index.html#tools">Tools</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="current">Tasks</span>
  </nav>

  <main class="tool-main">
    <div class="tool-page-head">
      <h1>Tasks</h1>
      <p class="tool-page-desc">Checklist. Nothing fancy.</p>
    </div>
    <div class="tool-panel" id="toolRoot">
<div class="btn-row" style="align-items:stretch"><input type="text" id="taskInput" placeholder="What needs doing?" style="flex:1"><button class="btn primary" type="button" id="taskAdd">Add</button></div><ul class="task-list" id="taskList"></ul><button class="btn danger" type="button" id="taskClearDone">Clear completed</button>
    </div>
    <p class="tool-back"><a href="index.html#tools">All tools</a></p>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>

  <footer>
    <div class="footer-inner">
      <span>toolbox</span>
      <span>runs in your browser</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
